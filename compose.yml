services:
  mysql:
    image: mysql:8.0
    command: --local-infile=1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ecdict-loader:
    build:
      context: ./ecdict-loader
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ECDICT_URL: ${ECDICT_URL}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ecdict-cache:/data

  reference-service:
    build:
      context: ./reference-service
    environment:
      KOKORO_MODEL_PATH: /root/kokoro-models/kokoro-v1.0.onnx
      KOKORO_VOICES_PATH: /root/kokoro-models/voices-v1.0.bin
    volumes:
      - kokoro-models:/root/kokoro-models
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')
      interval: 10s
      timeout: 5s
      retries: 12

  evaluation-service:
    build:
      context: ./evaluation-service
    environment:
      OPENPRONOUNCE_DEVICE: cpu
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL: /models/whisper
      HF_HOME: /root/.cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - ${WHISPER_MODEL_DIR}:/models/whisper:ro
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')
      interval: 10s
      timeout: 5s
      retries: 12

  practice-service:
    build:
      context: ./practice-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      REFERENCE_SERVICE_URL: http://reference-service:8001
      EVALUATION_SERVICE_URL: http://evaluation-service:8002
    depends_on:
      mysql:
        condition: service_healthy
      ecdict-loader:
        condition: service_completed_successfully
      reference-service:
        condition: service_healthy
      evaluation-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - practice-service
    ports:
      - "127.0.0.1:5173:80"

volumes:
  mysql-data:
  kokoro-models:
  huggingface-cache:
  ecdict-cache:
